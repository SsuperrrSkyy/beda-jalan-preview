<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diorama lab</title>
<style>
  html, body { margin: 0; background: #F2F5FA; font-family: system-ui, sans-serif; }
  body { min-height: 150vh; padding: 5vh 0 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .box { position: relative; width: 100%; max-width: 720px; aspect-ratio: 4 / 3; }
  .box img, .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .box canvas { opacity: 0; transition: opacity .5s ease; }
  .box img { transition: opacity .5s ease; }
  .box.live canvas { opacity: 1; }
  .box.live img { opacity: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 12px; }
  .bar button { font: 600 14px system-ui; padding: 8px 14px; border-radius: 999px; border: 1.5px solid #c9d2e0; background: #fff; color: #27324a; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #27324a; color: #fff; border-color: #27324a; }
  .bar button.st[aria-pressed="true"] { background: #2FB8C0; border-color: #2FB8C0; }
  .bar button.sh[aria-pressed="true"] { background: #F5B14A; border-color: #F5B14A; color: #3a2a08; }
  .sep { width: 1px; background: #c9d2e0; margin: 0 4px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div class="bar" id="scenes">
  <button type="button" data-scene="banjir" aria-pressed="true">Banjir</button>
  <button type="button" data-scene="aplikasi" aria-pressed="false">Aplikasi</button>
  <button type="button" data-scene="wabah" aria-pressed="false">Wabah</button>
  <span class="sep"></span>
  <button type="button" data-hl="st" class="st" aria-pressed="false">Sains-Teknologi</button>
  <button type="button" data-hl="sh" class="sh" aria-pressed="false">Sosial-Humaniora</button>
  <button type="button" data-hl="" aria-pressed="true">Tanpa sorot</button>
</div>
<div class="box" id="box">
  <img id="poster" src="assets/img/diorama/banjir.webp" alt="Diorama kota mini" width="1600" height="1200">
  <canvas id="c" aria-hidden="true"></canvas>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const first = q.get('scene') || 'banjir';
  const reduced = q.get('reduced') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  const box = document.getElementById('box');
  const poster = document.getElementById('poster');
  const urlOf = (s) => `assets/3d/diorama-${s}.glb`;
  const press = (sel, on) => document.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(on(b))));
  poster.src = `assets/img/diorama/${first}.webp`;
  press('[data-scene]', (b) => b.dataset.scene === first);
  let d = null;
  try {
    const { createDiorama } = await import('./js/landing2/diorama.js?v=bcf57cddb0');
    d = await createDiorama({ canvas: document.getElementById('c'), reduced, url: urlOf(first) });
    box.classList.add('live');
    root.dataset.mode = 'live';
    window.__stage = d;
    const hl = q.get('hl');
    if (hl) { d.highlight(hl); press('[data-hl]', (b) => b.dataset.hl === hl); }
  } catch (e) {
    console.warn('Diorama 3D skipped, poster stays:', e);
    root.dataset.mode = 'poster';
  }
  document.getElementById('scenes').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.scene) {
      poster.src = `assets/img/diorama/${b.dataset.scene}.webp`;
      press('[data-scene]', (x) => x === b);
      if (d) { try { await d.show(urlOf(b.dataset.scene)); } catch (e) { console.warn(e); } }
    } else if (b.hasAttribute('data-hl')) {
      press('[data-hl]', (x) => x === b);
      d?.highlight(b.dataset.hl || null);
    }
  });
  root.dataset.ready = '1';
</script>
</body>
</html>
