<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diorama lab</title>
<style>
  html, body { margin: 0; background: #F2F5FA; }
  body { min-height: 160vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  .box { position: relative; width: 100%; max-width: 720px; aspect-ratio: 4 / 3; }
  .box img, .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .box canvas { opacity: 0; transition: opacity .5s ease; }
  .box img { transition: opacity .5s ease; }
  .box.live canvas { opacity: 1; }
  .box.live img { opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div class="box" id="box">
  <img src="assets/img/diorama/banjir.webp" alt="Diorama kota mini: tanggul dan permukiman di tepi sungai" width="1600" height="1200">
  <canvas id="c" aria-hidden="true"></canvas>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'banjir';
  const reduced = q.get('reduced') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  try {
    const { createDiorama } = await import('./js/landing2/diorama.js');
    await createDiorama({ canvas: document.getElementById('c'), url: `assets/3d/diorama-${scene}.glb`, reduced });
    document.getElementById('box').classList.add('live');
    root.dataset.mode = 'live';
  } catch (e) {
    console.warn('Diorama 3D skipped, poster stays:', e);
    root.dataset.mode = 'poster';
  }
  root.dataset.ready = '1';
</script>
</body>
</html>
